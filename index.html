<div class="shell">
  <header class="topbar">
    <div class="brand"><div class="brandmark">◉</div><div><h1>Spread / Resistance</h1><small>15 种不同形状的三角地图 · 自选开局 · 自主扩散</small></div></div>
    <div class="top-actions"><button class="secondary small" id="guideBtn">玩法教程</button><button class="secondary small" id="voiceBtn" aria-expanded="false" aria-controls="voicePanel">语音房间</button><button class="secondary small" id="newGameBtn">新开一局</button></div>
  </header>

    <div class="actionrow"><button id="voiceCopy">复制邀请</button><a id="voiceOpen" target="_blank" rel="noopener noreferrer">在独立窗口加入</a><button class="secondary" id="voiceLeave">关闭本页通话</button></div>

  </section>

  </div>

<script>
(()=>{
const $=s=>document.querySelector(s), labels=['地图 A','地图 B','地图 C'], owners=['Resistance 1','Resistance 2','Resistance 3'];
const CELLS_PER_MAP=8;
const mapNames=['北湾三角洲','东岬群岛','长风海角','翡翠滩','月影湾','赤岩海岸','银沙群岛','霜叶半岛','紫藤岬','琥珀群礁','苍蓝港','珊瑚滩','暮光湾','青岚群岛','金雀海角'];
const mapColors=['#d8e8cc','#dfd7f2','#f5dfc2','#cbe7e4','#ead6e8','#f2d6c9','#d5e3f3','#e0e8d3','#e9d7ed','#f3e6be','#c8dfe8','#f5ddda','#d4d5ee','#cee4d8','#eee2c9'];
function triangleAdjacencies([o,r,q]){return o===0?[[1,r,q],[1,r,q-1],[1,r-1,q]]:[[0,r,q],[0,r+1,q],[0,r,q+1]]}
function createTile(seed){
  let n=seed*7919+113;
  const random=()=>{n=(Math.imul(n,1664525)+1013904223)>>>0;return n/4294967296};
  const coords=[[0,0,0]];
  while(coords.length<CELLS_PER_MAP){
    const occupied=new Set(coords.map(c=>c.join(',')));
    const options=[...new Map(coords.flatMap(triangleAdjacencies).filter(c=>!occupied.has(c.join(','))).map(c=>[c.join(','),c])).values()];
    const legal=options.filter(candidate=>{
      const all=[...coords,candidate],minR=Math.min(...all.map(c=>c[1])),maxR=Math.max(...all.map(c=>c[1])),minQ=Math.min(...all.map(c=>c[2]));
      const width=Math.max(...all.map(([o,r,q])=>(q-minQ)*56+(r-minR)*28+(o===1?28:0)+56));
      return width<=300&&(maxR-minR+1)*48.5<=205;
    });
    if(!legal.length)return null;
    coords.push(legal[Math.floor(random()*legal.length)]);
  }
  return coords;
}
function layoutMetrics(coords){
  const set=new Set(coords.map(c=>c.join(',')));
  const degrees=coords.map(c=>triangleAdjacencies(c).filter(n=>set.has(n.join(','))).length);
  return {edges:degrees.reduce((a,b)=>a+b,0)/2,deadEnds:degrees.filter(d=>d===1).length,branches:degrees.filter(d=>d===3).length};
}
function layoutSignature(coords){
  const minR=Math.min(...coords.map(c=>c[1])),minQ=Math.min(...coords.map(c=>c[2]));
  return coords.map(([o,r,q])=>[o,r-minR,q-minQ].join(',')).sort().join(';');
}
function buildMapLibrary(){
  const signatures=new Set(),prior=[];
  // Mix compact clusters, forks and irregular coves; reject long, nearly linear chains.
  const profiles=[
    {edges:8,deadEnds:1},{edges:7,deadEnds:3},{edges:8,deadEnds:2},
    {edges:7,deadEnds:2},{edges:7,deadEnds:4}
  ];
  return mapNames.map((name,i)=>{
    const profile=profiles[i%profiles.length];
    let best=null,bestSignature='',bestScore=-Infinity;
    for(let trial=0;trial<650;trial++){
      const coords=createTile(i*1000+trial+1);
      if(!coords)continue;
      const signature=layoutSignature(coords);
      if(signatures.has(signature))continue;
      const {edges,deadEnds,branches}=layoutMetrics(coords);
      if(edges<7||deadEnds>4||branches<1)continue;
      const signatureCells=new Set(signature.split(';'));
      const diversity=prior.length?Math.min(...prior.map(old=>{
        const overlap=[...signatureCells].filter(c=>old.has(c)).length;
        return 1-overlap/8;
      })):1;
      const score=120-Math.abs(edges-profile.edges)*24-Math.abs(deadEnds-profile.deadEnds)*12+diversity*40;
      if(score>bestScore){best=coords;bestSignature=signature;bestScore=score}
    }
    if(!best)throw new Error('无法生成不同的连通地图');
    signatures.add(bestSignature);prior.push(new Set(bestSignature.split(';')));
    return {name,coords:best,color:mapColors[i],coast:'#a8d7ce'};
  });
}
const layoutPool=buildMapLibrary();
let state=null, selected=null, actionMode='', dragging=null, aiSetup={spread:false,resistance:[false,false,false]},aiTimer=null;
function rand(n){return Math.floor(Math.random()*n)}
function shuffled(a){return [...a].sort(()=>Math.random()-.5)}
function mapId(m,i){return m*CELLS_PER_MAP+i}
function edge(a,b){return [a,b].sort((x,y)=>x-y).join(':')}
function log(msg){state.log.unshift(`第${state.round}轮 · ${msg}`);state.log=state.log.slice(0,35)}
function coastalPorts(coords, requested = 5) {
  const tiles = new Set(coords.map(cell => cell.join(',')));
  const coast = [];
  coords.forEach(([orientation, row, col], index) => {
    const adjacent = orientation === 0
      ? [[1,row,col], [1,row,col-1], [1,row-1,col]]
      : [[0,row,col], [0,row+1,col], [0,row,col+1]];
    if (adjacent.some(cell => !tiles.has(cell.join(',')))) coast.push(index);
  });
  const count = Math.min(requested, coast.length);
  return Array.from({length: count}, (_, i) => coast[Math.floor(i * coast.length / count)]);
}
function compactLayout(tile) {
  const coords = tile.coords.slice(0, CELLS_PER_MAP);
  return {...tile, coords, ports: coastalPorts(coords)};
}
function upgradeCoasts() {
  if (state.coastalVersion === 1) return;
  // Reassign old inland endpoints, keeping each pair of maps and all pieces.
  const replacements = new Map();
  state.maps.forEach((map, m) => {
    map.ports = coastalPorts(map.coords);
    const endpoints = [...new Set(state.links.flat())].filter(id => Math.floor(id / CELLS_PER_MAP) === m);
    const available = map.ports.map(i => mapId(m,i)).filter(id => !endpoints.includes(id));
    for (const id of endpoints) {
      if (!map.ports.includes(id % CELLS_PER_MAP)) replacements.set(id, available.shift());
    }
  });
  state.links = state.links.map(pair => pair.map(id => replacements.get(id) ?? id));
  state.coastalVersion = 1;
  persist();
}
function makeGame(ai=aiSetup){
  const tiles=shuffled(layoutPool).slice(0,3).map(compactLayout);
  state={coastalVersion:1,round:1,phase:'stitch',nextPhase:'',nextRole:'',ai:{spread:!!ai.spread,resistance:[...ai.resistance]},aiEmpty:[],maps:tiles.map(t=>({name:t.name,coords:t.coords,ports:t.ports,color:t.color,coast:t.coast})),positions:[{x:20,y:80},{x:395,y:250},{x:770,y:80}],links:[],stitchPairIndex:0,stitchNotice:'',seeds:[],setupSeedIds:[],autoSources:[],autoIndex:0,autoUsed:[],autoCount:0,nextApBonus:[0,0,0],infected:[],meter:1,ap:[0,0,0],sharedPool:0,activeMap:0,spreadLeft:0,selected:null,mode:'',winner:'',winReason:'',log:['新游戏开始。Spread 先把三个地图的出海口两两连接。']};
  selected=null;actionMode='';persist();render();
}
function persist(){try{if(state)localStorage.setItem('spreadResistanceSaveV14',JSON.stringify(state));else localStorage.removeItem('spreadResistanceSaveV14')}catch(e){}}
function load(){try{const x=localStorage.getItem('spreadResistanceSaveV14');if(x){state=JSON.parse(x);upgradeCoasts();if(state.phase!=="finished"){revealSeedsThrough(state.round-1);persist()}state.ai??={spread:false,resistance:[false,false,false]};state.aiEmpty??=[];aiSetup={spread:!!state.ai.spread,resistance:[...state.ai.resistance]}}}catch(e){state=null}}
function neighbors(id){
  const m=Math.floor(id/CELLS_PER_MAP),i=id%CELLS_PER_MAP,[o,r,q]=state.maps[m].coords[i],out=[];

  const inf=privateView?(localInfections===null?'仅查看自己的地图':`${localInfections}（本地图）`):state.infected.length;
  const seed=state.seeds.length,track=[0,1,2,3,4].map(i=>`<div class="meter-cell ${state.meter===i?'active':''}">${i===state.meter?'●':i}</div>`).join('');
  const log=state.log.filter(line => !privateView || !line.includes('Spread')).slice(0,10).map(x=>`<div class="log-item">${escapeHtml(x)}</div>`).join('');
  $('#side').innerHTML=`<h3>局势面板</h3><div class="resources"><span>轮次</span><strong>${state.round}</strong></div><div class="resources"><span>${privateView?'本地图感染':'公开感染'}</span><strong>${inf}${privateView?'':' / 24'}</strong></div><div class="resources"><span>隐藏种子（Spread 可见）</span><strong>${privateView?'?':seed}</strong></div><div class="rulebox"><strong>感染蔓延</strong><br>每轮 Spread 阶段开始时，由 Spread 为每个公开感染选择 1 个相邻空格埋种，之后 Resistance 才行动。感染若在之后被清除，已埋下的种子仍会成熟；若在 Spread 阶段开始前已被清除，则不会埋种。搜索落空会给团队提供搜查信息。清除感染的玩家下一轮个人 AP +1（奖励只持续一轮）。</div><h3 style="margin-top:18px">行动记录</h3><div class="log">${log}</div>`;
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderStatus(){
  const sel=(name,on)=>`<select aria-label="${name} 玩家类型" onchange="window.setAISeat('${name}',this.value==='ai')"><option value="human" ${on?'':'selected'}>人类</option><option value="ai" ${on?'selected':''}>AI</option></select>`,aiPanel=`<div class="ai-setup"><strong>玩家设置</strong><label>Spread ${sel('spread',aiSetup.spread)}</label>${owners.map((n,i)=>`<label>${n} ${sel(`r${i}`,aiSetup.resistance[i])}</label>`).join('')}<span>选 AI 的席位会自动操作；Resistance AI 只按本地图线索搜索。</span></div>`;
  if(!state){$('#statusbar').innerHTML=`<span class="pill">Spread 1 人，对抗 Resistance 3 人</span><span class="pill">同一设备轮流操作，AI 按选定席位自动行动</span>${aiPanel}`;return}
  const role=state.phase==='stitch'?'Spread 拼接地图':state.phase==='autoSpread'?'Spread 选择传播方向':state.phase==='spread'?'Spread 行动':state.phase==='resistance'?`${owners[state.activeMap]} 行动`:state.phase==='setup'?'Spread 放置初始种子':state.phase==='finished'?`${state.winner} 获胜`:'轮到交接设备';const currentSeat=state.phase==='resistance'?owners[state.activeMap]:['stitch','setup','autoSpread','spread'].includes(state.phase)?'Spread':state.nextRole;const aiLabel=isAISeat(currentSeat)?' · AI自动行动':'';
  const privateView=['resistance','handoff'].includes(state.phase);
  const infectionPill=privateView?(state.phase==='resistance'?`本地图感染 ${state.infected.filter(id=>Math.floor(id/CELLS_PER_MAP)===state.activeMap).length}`:'局势信息已隐藏'):`感染 ${state.infected.length} / 24`;
  $('#statusbar').innerHTML=`<span class="pill">第 <strong>${state.round}</strong> 轮</span><span class="pill">阶段：<strong>${role}${aiLabel}</strong></span><span class="pill">${aiLabel ? "AI 回合" : infectionPill}</span>${aiPanel}`;
}
function render(){
  renderStatus();
  scheduleAI();
  if (aiTimer !== null && state && state.phase !== 'finished' && (state.phase === 'handoff' ? isAISeat(state.nextRole) : state.phase === 'resistance' ? state.ai.resistance[state.activeMap] : state.ai.spread)) {
    $('#main').innerHTML = '<div class="handoff"><h2>AI 正在行动</h2><p>行动结束后会提示下一位玩家。</p></div>';
    $('#side').textContent = '';
    return;
  }
    const main=$('#main');main.classList.remove('stitch-main');if(!state){main.innerHTML=`<div class="eyebrow">可直接在浏览器运行 · 单设备轮流操作</div><h2>Spread 把种子埋进地图，Resistance 找出并清除它们。</h2><p class="intro">这是一个可玩的规则原型：从 15 种不同形状及颜色的不同轮廓的地图中抽出三张三角地图，每张由 8 个共边相接的编号区域组成，并有 5 个出海口候选。Spread 先点击配对出海口拼图，随后 Spread 在全图任选两个不同格子放置初始种子（可同图）；Resistance 只看自己的地图，不知道拼接方式。种子在抵抗者行动结束后公开成感染；Spread 每轮最多选择 2 个公开感染自行决定传播位置，再由 Resistance 应对。共边相接的三角格最多沿三条共边传播。</p><div class="howto"><div class="how"><b>① Spread 拼地图</b><span>三角区域只有共边才相邻，沿三条边传播。点击两个不同地图的出海口完成一条连接；再选一对港口把三张地图连起来。</span></div><div class="how"><b>② Spread 放种子</b><span>Spread 在全图任意两个不同格子放初始种子（可同图）；每轮固定主动放置 1 颗种子。</span></div><div class="how"><b>③ Resistance 应对</b><span>每位 Resistance 每轮有 1 次行动，团队另有 3 次共享行动，不需要预先分配。搜索种子用 1 次行动，清除公开感染用 2 次；每清除 1 个，行动者下一轮个人行动点 +1。搜查结果可以自由告诉队友，交流不消耗行动。</span></div><div class="how"><b>④ 爆发蔓延</b><span>Spread 阶段开始时，Spread 每轮最多选择 2 个成熟感染向相邻空格埋下隐藏种子，随后 Resistance 才能搜索或清除。本轮三位 Resistance 都行动完毕后，所有剩余种子公开为感染。</span></div></div><div class="notice">可在屏幕上方分别选择人类或 AI 席位。单设备轮流操作时会提示交接；Resistance 看不到 Spread 的种子和出海口拼接方式。</div><div class="actionrow"><button onclick="window.newGame()">开始新游戏</button></div><p class="footer-note">胜负：Resistance 清空全部种子与感染获胜；Spread 让全部 24 格都被感染或埋下种子时获胜。</p>`;$('#side').innerHTML=`<h3>原型规则</h3><div class="rulebox"><strong>Resistance 行动</strong><br>每人每轮 1 次行动，团队另有 3 次共享行动，可在 Resistance 行动阶段使用；搜索用 1 次，清除感染用 2 次。</div><div class="rulebox"><strong>地图拼接</strong><br>每张地图由 8 个共边相接的三角区域组成，Spread 从 5 个标记出海口中连接两组不同地图。</div><div class="rulebox"><strong>自动保存</strong><br>游戏进度保存在当前浏览器，刷新页面后可以继续。</div>`;return}
  if(state.phase==='finished'){
    const spread=state.winner==='Spread';main.innerHTML=`<div class="winner ${spread?'spread':''}"><div class="emoji">${spread?'🦠':'🛡️'}</div><div class="eyebrow">游戏结束</div><h2>${spread?'Spread 获胜':'Resistance 获胜'}</h2><p>${escapeHtml(state.winReason)}。第 ${state.round} 轮结束，共有 ${state.infected.length} 个公开感染和 ${state.seeds.length} 个隐藏种子。</p><button onclick="window.newGame()">再开一局</button></div><div class="actionrow"><button class="secondary" onclick="window.toggleFinalBoard()">查看 Spread 全图</button></div><div id="finalBoard"></div>`;renderSide();return
  }
  if(state.phase==='handoff'){
    const ai=isAISeat(state.nextRole);main.innerHTML=ai?`<div class="handoff"><div class="bigicon">🤖</div><div class="eyebrow">AI 正在行动</div><h2>${escapeHtml(state.nextRole)} 正在思考</h2><p class="intro" style="margin:10px auto 18px">AI 会根据自己能看到的信息选择行动。</p></div>`:`<div class="handoff"><div class="bigicon">${state.nextRole==='Spread'?'🦠':'🔄'}</div><div class="eyebrow">轮流交接</div><h2>请把设备交给 ${escapeHtml(state.nextRole)}</h2><p class="intro" style="margin:10px auto 18px">确认后进入该角色的操作界面。Resistance 只会看到当前玩家自己的地图。</p><button onclick="window.continueHandoff()">${state.nextRole==='Spread'?'进入 Spread 回合':'查看我的地图'}</button></div>`;renderSide();return
  }
  if(state.phase==='stitch'){
    const status=state.stitchNotice||'点击任意带⚓的格子，再点击另一张地图的港口，完成一条连接。';
    main.classList.add('stitch-main');main.innerHTML=`<div class="eyebrow">Spread · 开局拼接</div><h2>点击两个港口建立连接</h2><p class="intro">先选一个带⚓的格子，再选另一张地图上的港口。重复一次完成两组连接；每个港口只能用一次，三张地图都要连通。</p><div class="stitch-toolbar"><span class="selection">${escapeHtml(status)}　·　已连接 ${state.stitchPairIndex} / 2</span><div class="actionrow"><button class="secondary small" onclick="window.undoStitch()" ${state.stitchPairIndex===0?'disabled':''}>撤回</button><button class="small" onclick="window.finishStitch()" ${state.stitchPairIndex<2||!mapsConnected()?'disabled':''}>完成拼接</button></div></div>${renderMaps('spread')}`;renderSide();requestAnimationFrame(drawStitchLines);return
  }
  if(state.phase==='setup'){
    main.innerHTML=`<div class="eyebrow">Spread · 初始放置</div><h2>放置两个初始隐藏种子</h2><p class="intro">在全图任选两个不同的空格放种子（可位于同一张地图）。Resistance 不会看到种子位置，也不知道拼接方式。</p><div class="actionrow"><span class="selection">${selected===null?'尚未选择位置':`已选择 ${cellLabel(selected)}`}</span><button class="gold" onclick="window.placeInitial()" ${selected===null?'disabled':''}>放置初始种子</button></div>${renderMaps('spread')}`;renderSide();return
  }
  if(state.phase==='autoSpread'){
    const source=currentAutoSource(),options=currentAutoChoices(),sources=availableAutoSources();
    main.innerHTML=`<div class="eyebrow">Spread · 第 ${state.round} 轮 · 感染扩散</div><h2>最多选择 2 个成熟感染进行扩散</h2><p class="intro">本轮已扩散 <strong>${state.autoCount||0} / 2</strong> 次。先点击任一可扩散的成熟感染，再点击它相邻的绿色空格。每个成熟感染本轮最多扩散一次；之后仍可主动放 1 颗种子。</p><div class="selection">${source===null?'请点击一个成熟感染选择扩散来源':`当前来源：${cellLabel(source)}；可选目标：${options.map(cellLabel).join('、')}`}</div><div class="actionrow"><button class="secondary" onclick="window.finishAutoSpread()">跳过剩余扩散</button><span class="selection">可选感染源：${sources.length}</span></div>${renderMaps('spread')}`;renderSide();return
  }
  if(state.phase==='spread'){
    const legal=legalSeedCells(),notice=state.notice?`<div class="notice warn">${escapeHtml(state.notice)}</div>`:'';main.innerHTML=`<div class="eyebrow">Spread · 第 ${state.round} 轮</div><h2>选择扩散路线</h2><p class="intro">每轮固定主动放置 1 个隐藏种子。每个种子可从公开感染或任意隐藏种子继续向相邻空格铺开，由 Spread 决定扩散方向。三角格共边或配对出海口相连才算相邻。绿色虚线格均可选择。</p>${notice}<div class="actionrow"><button class="secondary" onclick="window.endSpread()">结束 Spread 行动</button>${legal.length?'<span class="selection">点击绿色区域，自己决定扩散路线</span>':'<span class="selection">没有合法相邻空位</span>'}</div>${renderMaps('spread')}`;renderSide();return
  }
  if(state.phase==='resistance'){
    const m=state.activeMap,sel=selected,selInfected=sel!==null&&state.infected.includes(sel),modeLabel=actionMode==='guess'?'搜索种子':actionMode==='clear'?'清除感染':'选择行动';
    const ap=availableAP(m);let msg=state.notice?`<div class="notice ${state.notice.includes('没有')?'warn':''}">${escapeHtml(state.notice)}</div>`:'';state.notice='';
    main.innerHTML=`<div class="eyebrow">${escapeHtml(owners[m])} · ${escapeHtml(labels[m])}</div><h2>查看你的地图并选择行动</h2><p class="intro">先点本图的编号格，再选择搜索或清除。锚形标记是可通往其他地图的候选出海口。</p>${msg}<div class="actionrow"><span class="pill">个人行动：<strong>${state.ap[m]}</strong>　共享行动：<strong>${state.sharedPool}</strong></span><span class="pill">选择：<strong>${sel===null?'无':cellLabel(sel)}</strong></span></div><div class="modebar"><button class="gold" onclick="window.guessSeed()" ${sel===null||selInfected||ap<1?'disabled':''}>搜索所选格 · 1 点</button><button class="danger" onclick="window.clearInfection()" ${!selInfected||ap<2?'disabled':''}>清除所选感染 · 2 点</button></div><div class="action-help">搜索隐藏种子花费 1 次行动，清除公开感染花费 2 次。搜查结果可以口头分享；已埋下的种子会独立成熟，即使来源感染被清除也不受影响。</div>${renderMaps('resistance')}<div class="actionrow"><button class="secondary" onclick="window.finishMap()">结束 ${owners[m]} 行动</button></div>`;renderSide();return
  }
}
window.setAISeat=(seat,on)=>{if(seat==='spread')aiSetup.spread=on;else{const i=Number(seat.slice(1));aiSetup.resistance[i]=on}if(state){state.ai={spread:aiSetup.spread,resistance:[...aiSetup.resistance]};persist();render()}else renderStatus()};
window.newGame=()=>{if(state&&state.phase!=='finished'&&!confirm('现在开始新游戏？当前进度会被覆盖。'))return;if(aiTimer!==null){clearTimeout(aiTimer);aiTimer=null}makeGame(aiSetup)};
window.gameCell=chooseCell;
window.undoStitch=undoStitch;
window.finishStitch=finishStitch;
window.dragStart=dragStart;

window.placeInitial=placeInitial;
window.endSpread=endSpread;
window.finishAutoSpread=()=>{if(state.phase==='autoSpread')beginManualSpread()};


window.continueHandoff=()=>{const p=state.nextPhase;state.nextRole='';state.nextPhase='';if(p==='spread'){startSpreadRound();return}if(p&&p.startsWith('resistance-')){showMapTurn(Number(p.slice(-1)));return}if(p==='resistance'){showMapTurn(0);return}};
window.setMode=m=>{actionMode=m;state.mode=m;render()};
window.guessSeed=guess;
window.clearInfection=clearInfection;
window.finishMap=finishMap;
window.toggleFinalBoard=()=>{const el=$('#finalBoard');if(el.innerHTML)el.innerHTML='';else el.innerHTML=renderMaps('spread')};
document.addEventListener('pointermove',dragMove);
document.addEventListener('pointerup',dragEnd);
document.addEventListener('pointercancel',dragEnd);
new MutationObserver(()=>requestAnimationFrame(drawStitchLines)).observe($('#main'),{childList:true,subtree:true});
$('#newGameBtn').onclick=window.newGame;
const lessons = [
  ['选择席位','1 位 Spread 对抗 3 位 Resistance。每个席位都能交给 AI。你可以先当 Spread，观察种子如何沿着路线扩散。'],
  ['连接港口','锚形标记只会出现在有外露边的三角格上。点 A 图一个港口，再点 B 图一个港口。用剩下的港口把 C 图也连进来，再点「完成拼接」。'],
  ['埋下种子','开局由 Spread 在全图任意两个不同格子自由放种子，可放同一张地图。之后每次 Spread 行动，先由 Spread 最多选择 2 个成熟感染向相邻格扩散，再由你沿共边或已连接的港口放 1 颗。每轮只可主动放 1 颗。'],
  ['搜查自己的地图','叶形是隐藏种子，只有 Spread 看得见。星芒是公开感染。Resistance 选一个格子，花 1 点搜索种子，或花 2 点清除公开感染。每人基础 1 点个人行动，另有团队共用的 3 点。'],
  ['沟通与胜负','可以在语音中报出地图字母、格号和搜索结果，交流免费。本轮三位 Resistance 都行动完毕后，手动和自动种子一起结算，未清除的全部公开为感染。24 格全部有种子或感染时 Spread 胜，全部清空时 Resistance 胜。']
];
let lesson = 0;
function showLesson() {
  $('#guideStep').textContent = (lesson+1)+' / '+lessons.length;
  $('#guideTitle').textContent = lessons[lesson][0];
  $('#guideText').textContent = lessons[lesson][1];
  $('#guideBack').disabled = lesson === 0;
  $('#guideNext').textContent = lesson===lessons.length-1 ? '返回游戏' : '下一步';
}
$('#guideBtn').onclick = () => { lesson=0; showLesson(); $('#guide').showModal(); };
$('#guideBack').onclick = () => { lesson--; showLesson(); };
$('#guideNext').onclick = () => {
  if (lesson===lessons.length-1) return $('#guide').close();
  lesson++; showLesson();
};
$('#voiceBtn').onclick = () => {
  const panel = $('#voicePanel');
  panel.hidden = !panel.hidden;
  $('#voiceBtn').setAttribute('aria-expanded', String(!panel.hidden));
};
$('#voiceCreate').onclick = () => {
  const bytes = crypto.getRandomValues(new Uint8Array(16));
  const room = 'SpreadResistance' + Array.from(bytes, b=>b.toString(16).padStart(2,'0')).join('');
  const url = 'https://meet.jit.si/' + room + '#config.startAudioOnly=true&config.startWithAudioMuted=true&config.startWithVideoMuted=true';
  $('#voiceURL').value = url;
  $('#voiceOpen').href = url;
  $('#voiceSession').hidden = false;
  $('#voiceCreate').hidden = true;
  $('#voiceStatus').textContent = '加入后点击房间内的麦克风并允许使用。若浏览器限制嵌入式通话，请使用独立窗口。';
  const frame = document.createElement('iframe');
  frame.title = '队伍语音室';
  frame.allow = 'microphone; autoplay';
  frame.src = url;
  $('#voiceMount').replaceChildren(frame);
};
$('#voiceCopy').onclick = async () => {
  try { await navigator.clipboard.writeText($('#voiceURL').value); $('#voiceStatus').textContent = '邀请链接已复制。'; }
  catch { $('#voiceURL').select(); $('#voiceStatus').textContent = '请复制选中的链接。'; }
};
$('#voiceLeave').onclick = () => {
  $('#voiceMount').replaceChildren();
  $('#voiceSession').hidden = true;
  $('#voiceCreate').hidden = false;
};
load();render();
})();
</script>
